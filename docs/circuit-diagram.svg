<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670"><title>ESP32 adaptive scheduling I2C sensors and Home Assistant Matter path</title><rect width="1100" height="670" fill="white"/><g font-family="sans-serif" font-size="18" fill="#123"><text x="25" y="35">ID10 • ESP32 DevKit • USB 5V input • sensor and GPIO rails 3.3V</text><rect x="40" y="100" width="310" height="370" fill="#e8f4fa" stroke="#123"/><text x="60" y="130">ESP32 ESPHome</text><text x="60" y="185">3V3 → both sensor VCC</text><text x="60" y="240">GPIO21 SDA</text><text x="60" y="295">GPIO22 SCL</text><text x="60" y="350">GPIO25 output → 330Ω</text><text x="60" y="405">GND → common rail</text><rect x="660" y="105" width="390" height="140" fill="#eef9ef" stroke="#123"/><text x="680" y="135">BME280 I2C 0x76</text><text x="680" y="170">VCC/CSB → 3V3; SDO → GND</text><text x="680" y="200">SDA →21; SCL →22; GND →GND</text><text x="680" y="230">Temperature, humidity, pressure</text><rect x="660" y="280" width="390" height="115" fill="#eef9ef" stroke="#123"/><text x="680" y="310">BH1750 I2C 0x23</text><text x="680" y="340">VCC →3V3; ADDR/GND →GND</text><text x="680" y="370">SDA →21; SCL →22</text><text x="660" y="440">GPIO25 →330Ω →LED anode; cathode →GND</text><text x="25" y="520">Wi-Fi native API → Home Assistant (clock + occupancy helper)</text><text x="25" y="560">Home Assistant entities → Matterbridge-hass → Matter controller</text><text x="25" y="605">USB powers ESP32. Both sensor breakouts need pull-ups to 3.3V only.</text><text x="25" y="640">No physical load: LED is a schedule recommendation, not HVAC or mains control.</text></g><g stroke="#267394" stroke-width="3" fill="none"><path d="M350 235 H500 V195 H660 M500 235 V365 H660"/><path d="M350 290 H540 V215 H660 M540 290 V380 H660"/><path d="M350 345 H590 V435 H650"/><path d="M350 400 H590 V465 H1040"/></g></svg>